[project]
name = "benji"
dynamic = ["version"]  # source of truth: benji/__init__.py:__version__
description = "macOS real-time transcription overlay (mic → VAD → STT → subtitles)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Guillaume Demergès" }]

dependencies = [
    "sounddevice>=0.4.6",
    "numpy~=2.3.5",
    # PySide6 plutôt que PyQt6 : binding Qt officiel, **LGPL-3.0** au lieu de
    # GPL-3.0 — Benji se distribue en binaire fermé. Et le paquet est scindé :
    # `Essentials` (QtCore/QtGui/QtWidgets/QtSvg, tout ce qu'on importe) sans
    # `Addons` (QtQuick3D, QtMultimedia, QtWebEngine — 332 Mo qu'on n'installe
    # simplement jamais), là où PyQt6 livrait les 241 Mo d'un bloc.
    "PySide6-Essentials~=6.11.2",
    "onnxruntime~=1.23.2",
    "psutil~=7.2.2",
    "httpx~=0.28.1",
    "keyring>=25.0",
    "pyobjc-framework-Cocoa>=10.0 ; sys_platform == 'darwin'",
    # État exact de l'autorisation micro au premier lancement (benji/onboarding.py).
    # Sans elle on ne saurait pas distinguer « refusé » de « silence », et un
    # refus laisserait l'app muette sans un mot d'explication.
    "pyobjc-framework-AVFoundation>=10.0 ; sys_platform == 'darwin'",
    # Téléchargement des poids avec progression au premier lancement. Déjà tiré
    # transitivement par parakeet-mlx ; déclaré parce qu'on l'importe.
    "huggingface-hub>=0.24",
    "pywin32>=306 ; sys_platform == 'win32'",
    "mlx-lm~=0.26.3 ; sys_platform == 'darwin'",
    # Moteur des passes partielles. Poids sous licence CC-BY-4.0 :
    # l'attribution NVIDIA est due dans le produit distribué.
    "parakeet-mlx>=0.1 ; sys_platform == 'darwin'",
    # Moteur de la passe finale : seul des deux à savoir forcer la langue.
    "mlx-whisper>=0.4.0 ; sys_platform == 'darwin'",
    # Moteur local hors Mac (Windows/Linux, sans MLX) : partielles et finale,
    # cf. FasterWhisperBackend dans benji/stt/backend.py. CPU par défaut, CUDA
    # utilisé automatiquement s'il est détecté.
    "faster-whisper>=1.0 ; sys_platform != 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.14",
]

[project.optional-dependencies]
diarization = [
    # Real speaker diarization via pyannote embeddings + cosine clustering.
    # Requires HF_TOKEN env var on first run to download the model.
    # >=4.0: diarization.py uses the 4.x Model.from_pretrained API (token=, revision=).
    "pyannote.audio>=4.0",
    "torch>=2.2.0",
]
cloud = [
    # Résumé via l'API Claude (LLMConfig.summary_provider = "cloud").
    # Clé via la variable d'environnement ANTHROPIC_API_KEY.
    "anthropic>=0.40.0",
    # Transcription via le backend Benji (STTConfig.stt_provider = "remote").
    "websockets>=12",
]
monitoring = [
    # Remontée des crashs (benji/monitoring.py). Inactif sans BENJI_SENTRY_DSN.
    "sentry-sdk>=2.0",
]

[project.scripts]
benji = "benji.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "benji/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["benji"]

[tool.pytest.ini_options]
# Explicite plutôt que devine : pytest-qt choisit sinon le premier binding
# trouve, et une machine ou PyQt traine encore ferait passer les tests contre
# un toolkit que l'app n'utilise plus.
qt_api = "pyside6"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "posix_perms: vérifie des bits de permission POSIX (0600) — sauté sous Windows, où NTFS passe par des ACL",
]

[tool.ruff]
# No mypy / type stubs (project rule) — ruff is the only static gate.
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Conservative, high-signal set: pyflakes (F), import sorting (I),
# pycodestyle warnings (W), and pyupgrade (UP). Line length (E501) is left
# off on purpose — several lines are intentionally long. Ratchet up later.
select = ["F", "I", "W", "UP"]

[tool.uv]
# Deux dépendances transitives lourdes, déclarées en dur par nos moteurs mais
# jamais atteintes à l'exécution. Les marqueurs impossibles les retirent de la
# résolution sans forker les paquets amont.
override-dependencies = [
    # torch (~390 Mo avec sa suite) n'est tiré que par `mlx_whisper/torch_whisper.py`,
    # module que *rien* n'importe : il sert au script de conversion de poids.
    # Le marqueur `extra == 'diarization'` le fait revenir — et seulement là —
    # car pyannote, lui, en a réellement besoin.
    "torch ; extra == 'diarization'",
    # librosa (~40 Mo avec scikit-learn, soundfile, pooch, soxr) n'est tiré que
    # par `parakeet_mlx.audio` pour un seul appel, `filters.mel`, réimplémenté
    # dans `benji/stt/mel_filters.py` et verrouillé bit à bit par les tests.
    # Retiré inconditionnellement, lui : aucun extra n'en a besoin, et
    # `mel_filters.install()` couvre les deux cas de toute façon.
    "librosa ; sys_platform == 'never'",
]
